# Smithery 托管/发现清单（可选）
# 上传方式：把仓库连到 https://smithery.ai （或使用 smithery CLI），Smithery 会读取本文件。
# 说明：本服务器只读公开月报数据、无需任何 API Key 或环境变量，因此 configSchema 为空对象。
startCommand:
  type: stdio
  configSchema:
    type: object
    properties: {}
    additionalProperties: false
  commandFunction: |-
    (config) => ({ command: "uvx", args: ["groundwater-monthly-mcp"] })
