# ---------------------------------------------------------------------------
# 发布流水线：推送 v* tag 时构建 sdist/wheel，发布到 PyPI，并推送 ghcr.io 镜像
#
# 首次使用前需要在 GitHub / PyPI 上做的一次性配置（详见 docs/deploy.md 第 6 节）：
#   1. PyPI → Your projects → Publishing（Trusted publishers）新增：
#        Owner: <GitHub 用户名或组织>   Repository: groundwater-monthly-mcp
#        Workflow name: release.yml     Environment name: pypi
#      → 配置好后本工作流用 OIDC 发布，不需要在仓库里存 PyPI token。
#   2. GitHub 仓库 Settings → Actions → General → Workflow permissions
#      选择 "Read and write permissions"（推送 ghcr.io 需要 packages: write）。
#   3. 如需发 GitHub Release 产物，无需额外 secret；GITHUB_TOKEN 自带 contents: write。
#   4. 可选：用 `vars.PYPI_PROJECT` 之类的仓库变量覆盖默认 PyPI 包名。
# ---------------------------------------------------------------------------
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: 构建 sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装构建工具
        run: python -m pip install --upgrade build

      - name: 构建 sdist 与 wheel
        run: python -m build

      - name: 校验 wheel 内的随包数据
        run: python scripts/package_check.py wheel

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: 发布到 PyPI（Trusted Publishing，可选）
    # 默认跳过；在仓库 Settings → Variables 设置 PUBLISH_PYPI=true 并配置好
    # PyPI Trusted Publisher 后才会执行（无需在仓库里存 token）。
    if: vars.PUBLISH_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/groundwater-monthly-mcp
    permissions:
      id-token: write # OIDC，用于 PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          # 非首次发布/私有索引时可改成：
          # repository-url: https://test.pypi.org/legacy/
          # password: ${{ secrets.PYPI_API_TOKEN }}   # 仅当不用 trusted publishing 时
          # skip-existing: true

  docker:
    name: 构建并推送 ghcr.io 镜像（可选）
    # 默认跳过；在仓库 Settings → Variables 设置 PUBLISH_DOCKER=true 后才会执行。
    if: vars.PUBLISH_DOCKER == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像 tag/label
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送（多架构）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: 创建 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: 校验 wheel 内容
        run: |
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          for required in ("data/groundwater.db", "data/geo/", "data/map/leaflet.js"):
              assert any(required in n for n in names), required
          print(wheel, "ok", len(names), "files")
          PY

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
